name: Feature request
description: Suggest something Quick Expense should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
  - type: textarea
    id: gst
    attributes:
      label: GST or reporting impact
      description: Does this affect GSTR-3B, 2B reconciliation, ITC eligibility or the Purchase Register?
