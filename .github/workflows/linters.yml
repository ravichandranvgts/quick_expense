name: Linters

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linters:
    name: pre-commit and semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pre-commit (ruff, prettier, eslint, file checks)
        uses: pre-commit/action@v3.0.1

      - name: Frappe semgrep rules
        run: |
          git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules
          pip install semgrep
          semgrep scan --error --metrics=off --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness quick_expense
