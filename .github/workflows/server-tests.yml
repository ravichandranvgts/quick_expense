name: Server Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: server-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  FRAPPE_BRANCH: version-16

jobs:
  tests:
    name: Python unit tests (MariaDB)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: travis
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Add test_site to hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install Frappe, ERPNext, India Compliance and Quick Expense
        run: bash ${GITHUB_WORKSPACE}/.github/helper/install.sh

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site run-tests --app quick_expense

      - name: Show bench output
        if: ${{ always() }}
        run: cat ~/frappe-bench/bench_start.log || true
